[package]
name = "feedrsauros"
version = "0.1.0"
edition = "2024"

[dependencies]
ammonia = "4.2.0"
anyhow = "1.0.104"
axum = "0.8.9"
chacha20poly1305 = "0.11"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
feed-rs = "2.4.0"
hex = "0.4.3"
open = "5.4.4"
opml = "1.1.6"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "deflate", "http2"] }
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
slug = "0.1.6"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"

[build-dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1.53.1", features = ["rt"] }

[workspace]
members = ["desktop"]
